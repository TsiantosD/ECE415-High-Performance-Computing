<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1520" viewBox="0 0 1400 1520" role="img" aria-labelledby="title desc">
  <title id="title">ECE415 high-performance computing lab map</title>
  <desc id="desc">A vertical map of the ECE415 labs from CPU optimization and OpenMP to CUDA convolution, CLAHE, and N-body simulation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".24"/>
    </filter>
    <style>
      .title{font:800 52px Inter,Segoe UI,Arial,sans-serif;fill:#e0f2fe}
      .sub{font:500 27px Inter,Segoe UI,Arial,sans-serif;fill:#bfdbfe}
      .card{fill:url(#card);stroke:#334155;stroke-width:3;rx:30;filter:url(#shadow)}
      .numBg{fill:#67e8f9}.num{font:800 25px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.numSmall{font:800 21px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .head{font:800 34px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.body{font:500 27px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .tag{rx:14}.tagText{font:800 17px Inter,Segoe UI,Arial,sans-serif;fill:#08111f}
      .cpu{fill:#86efac}.omp{fill:#fbbf24}.cuda{fill:#60a5fa}.gpu{fill:#c084fc}.nbody{fill:#fb7185}
      .chev{fill:#67e8f9}.muted{fill:#67e8f9;opacity:.10}
    </style>
  </defs>

  <rect width="1400" height="1520" fill="url(#bg)"/>
  <circle cx="1185" cy="135" r="260" class="muted"/>
  <circle cx="125" cy="1385" r="280" class="muted"/>

  <text x="80" y="88" class="title">ECE415 High-Performance Computing</text>
  <text x="82" y="132" class="sub">Optimization path from scalar CPU code to CUDA kernels and multi-GPU simulation</text>

  <g transform="translate(80,200)">
    <rect width="1240" height="205" class="card"/>
    <circle cx="58" cy="61" r="31" class="numBg"/><text x="58" y="70" text-anchor="middle" class="num">1</text>
    <text x="115" y="73" class="head">Lab 1 · Sobel CPU optimization</text>
    <text x="115" y="124" class="body">Serial image-filter tuning with loop transformations,</text>
    <text x="115" y="161" class="body">strength reduction, inlining, and OpenMP comparison.</text>
    <rect x="990" y="62" width="170" height="44" class="tag cpu"/><text x="1075" y="91" text-anchor="middle" class="tagText">CPU</text>
    <rect x="990" y="122" width="170" height="44" class="tag cpu" opacity=".72"/><text x="1075" y="151" text-anchor="middle" class="tagText">SOBEL</text>
  </g>

  <path d="M650 445 h100 l-50 58 z" class="chev"/>

  <g transform="translate(80,535)">
    <rect width="1240" height="205" class="card"/>
    <circle cx="58" cy="61" r="31" class="numBg"/><text x="58" y="70" text-anchor="middle" class="num">2</text>
    <text x="115" y="73" class="head">Lab 2 · OpenMP K-Means</text>
    <text x="115" y="124" class="body">Parallel clustering with critical sections, atomics,</text>
    <text x="115" y="161" class="body">SIMD experiments, and timing comparisons.</text>
    <rect x="970" y="62" width="210" height="44" class="tag omp"/><text x="1075" y="91" text-anchor="middle" class="tagText">OPENMP</text>
    <rect x="970" y="122" width="210" height="44" class="tag omp" opacity=".72"/><text x="1075" y="151" text-anchor="middle" class="tagText">K-MEANS</text>
  </g>

  <path d="M650 780 h100 l-50 58 z" class="chev"/>

  <g transform="translate(80,870)">
    <rect width="1240" height="205" class="card"/>
    <circle cx="58" cy="61" r="31" class="numBg"/><text x="58" y="70" text-anchor="middle" class="num">3</text>
    <text x="115" y="73" class="head">Lab 3 · CUDA convolution</text>
    <text x="115" y="124" class="body">2D convolution kernels study block sizing, padding,</text>
    <text x="115" y="161" class="body">precision tradeoffs, divergence, and GPU timing.</text>
    <rect x="990" y="62" width="170" height="44" class="tag cuda"/><text x="1075" y="91" text-anchor="middle" class="tagText">CUDA</text>
    <rect x="990" y="122" width="170" height="44" class="tag cuda" opacity=".72"/><text x="1075" y="151" text-anchor="middle" class="tagText">CONV2D</text>
  </g>

  <path d="M650 1115 h100 l-50 58 z" class="chev"/>

  <g transform="translate(80,1205)">
    <rect width="1240" height="245" class="card"/>
    <circle cx="58" cy="61" r="31" class="numBg"/><text x="58" y="69" text-anchor="middle" class="numSmall">4–5</text>
    <text x="115" y="73" class="head">Labs 4–5 · GPU application optimization</text>
    <text x="115" y="124" class="body">CLAHE and N-body simulation add streams,</text>
    <text x="115" y="161" class="body">shared memory, SoA layout, and coarsening,</text>
    <text x="115" y="198" class="body">then tune FMA, launch bounds, divergence,</text>
    <text x="115" y="235" class="body">and multi-GPU execution.</text>
    <rect x="930" y="55" width="130" height="44" class="tag gpu"/><text x="995" y="84" text-anchor="middle" class="tagText">GPU</text>
    <rect x="1080" y="55" width="150" height="44" class="tag nbody"/><text x="1155" y="84" text-anchor="middle" class="tagText">N-BODY</text>
    <rect x="930" y="130" width="300" height="44" class="tag cuda" opacity=".72"/><text x="1080" y="159" text-anchor="middle" class="tagText">CUDA OPTIMIZATION</text>
  </g>
</svg>
